# Configuration for probot-auto-merge - https://github.com/instana/probot-auto-merge
updateBranch: false
reportStatus: true
deleteBranchAfterMerge: false
# For more information see: https://docs.github.com/en/graphql/reference/enums#commentauthorassociation
minApprovals:
  NONE: 0
# For more information see https://help.github.com/articles/about-pull-request-merges/
mergeMethod: merge
blockingLabels:
- "do not merge"
- "help wanted"
- "needs discussion"
- "WIP"
- "waiting for design"
requiredBranches:
- "^develop$"
requiredTitleRegex: "^Update develop with changes from .+$"
