<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Instana</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #canvas {
      width: 100%;
      height: 100%;
    }
    #GLCanvasOverlay{
      top:0px;
      height:100%;
      width:100%;
      position:absolute;
      background-color:transparent;
    }
    .rs-base{
        position: absolute;
        z-index: 10000;
        padding: 10px;
        background-color: #222;
        font-size: 10px;
        line-height: 1.2em;
        width: 350px;
        font-family: 'Roboto Condensed', tahoma, sans-serif;
        left: 0;
        top: 0;
        overflow: hidden;
    }
    .rs-base h1{
        margin: 0;
        padding: 0;
        font-size: 1.4em;
        color: #fff;
        margin-bottom: 5px;
        cursor: pointer;
    }
    .rs-base div.rs-group{
        margin-bottom: 10px;
    }
    .rs-base div.rs-group.hidden{
        display: none;
    }
    .rs-base div.rs-fraction{
        position: relative;
        margin-bottom: 5px;
    }
    .rs-base div.rs-fraction p{
        width: 120px;
        text-align: right;
        margin: 0;
        padding: 0;
    }
    .rs-base div.rs-legend{
        position: absolute;
        line-height: 1em;
    }
    .rs-base div.rs-counter-base{
        position: relative;
        margin: 2px 0;
        height: 1em;
    }
    .rs-base span.rs-counter-id{
        position: absolute;
        left: 0;
        top: 0;
    }
    .rs-base div.rs-counter-value{
        position: absolute;
        left: 90px;
        width: 30px;
        height: 1em;
        top: 0;
        text-align: right;
    }
    .rs-base canvas.rs-canvas{
        position: absolute;
        right: 0;
    }
    .serverCSS3DLayer, .softwareCSS3DLayer{
      font-size: 20px;
      font-family: 'Arial', serif;
      color: white;
      background-color: transparent;
      width: 400px;
      height: 400px;
    }
    .softwareCSS3DLayer{
      font-size: 32px;
      width: 200px;
      height: 50px;
    }
    input {
      width: 120px;
    }
  </style>
</head>
<body>
  <div id="WebGL">
    <div id="GLCanvas">
      <div id="GLCanvasOverlay">
      </div>
    </div>
  </div>

  <input id="newHostButton" style="position:absolute; right:0px; top:0px;" type="button" value="new host">
  <input id="newContainerButton" style="position:absolute; right:0px; top:25px;" type="button" value="new container">
  <input id="stackContainerButton" style="position:absolute; right:0px; top:50px;" type="button" value="stack container">
  <input id="showWalkableButton" style="position:absolute; right:0px; top:75px;" type="button" value="show walkable">
  <input id="destroyCubeButton" style="position:absolute; right:0px; top:100px;" type="button" value="destroy cube">
  <script src="bundle/index.js"></script>
</body>
</html>
