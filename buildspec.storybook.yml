version: 0.2

env:
  variables:
    CODEBUILD_PROJECT_NAME: "ui-client-storybook"
    RUN_UI_STORYBOOK_TEST: "false"
  parameter-store:
    AWS_ACCESS_KEY_ID: "s3.devinfra.access.key.id"
    AWS_SECRET_ACCESS_KEY: "s3.devinfra.secret.access.key"
    INSTANA_ARTIFACTORY_USERNAME: "delivery.instana.io.internal.rw.username"
    INSTANA_ARTIFACTORY_PASSWORD: "delivery.instana.io.internal.rw.password"
    EFS_DATA_DIR: "efs.data.dir"
    EFS_DNS: "efs.data.dns"
    GITHUB_API_TOKEN: "ibm.github.e.api.token"
    GITHUB_READ_PASSWORD: "github.read.password"
    GITHUB_READ_USER: "github.read.user"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      # Remove SBT repository: https://github.com/aws/aws-codebuild-docker-images/issues/449
      - rm -f /etc/apt/sources.list.d/sbt.list
      # Set up the shared tooling
      - ./build/download-ci-shared-tools.bash
      - 'USE_N=true ./build/ci-shared-tools/scripts/setup.bash'
      - ./build/ci-shared-tools/scripts/codebuild/setup.bash
      - export GIT_BRANCH="$(./build/ci-shared-tools/scripts/git/getBranch.js)"
      # Set up the correct Node.js version
      - n `cat .nvmrc`
  pre_build:
    commands:
      - git remote set-url origin "https://${GITHUB_API_TOKEN}:x-oauth-basic@github.ibm.com/instana/ui-client.git"
      - git config --global user.email "instana.ibm.github.enterprise@ibm.com"
      - git config --global user.name "Instana-IBM-GitHub-Enterprise"
      - |
        REGISTRY="https://delivery.instana.io" \
          REPOSITORY_KEY="int-npm-virtual" \
          USERNAME="$INSTANA_ARTIFACTORY_USERNAME" \
          PASSWORD="$INSTANA_ARTIFACTORY_PASSWORD" \
          NON_INTERACTIVE=true \
          WRITE_TO_CWD=true \
          NPM_CONFIG_REGISTRY="https://registry.npmjs.org/" \
          npx create-artifactory-access-config
      # Install project dependencies
      - npm install -g yarn@1.22.19
      # reduce redundant build output
      - yarn install --frozen-lockfile
  build:
    commands:
      - ./build/deployStorybook.sh
      - test -n "$RUN_UI_STORYBOOK_TEST" -a "$RUN_UI_STORYBOOK_TEST" = "true" && yarn run storybookTest || true # ignore test's exit code if condition not met
