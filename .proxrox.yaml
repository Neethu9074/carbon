serverName: local.internal.instana.io
port: 4000
root: false
ssi: true
tls: true
proxy:
  /: http://127.0.0.1:3000
  /api/: https://monitoring-instana.instana.io/api/

  /auth/signIn: https://monitoring-instana.instana.io/auth/signIn
  /auth/signOut: https://monitoring-instana.instana.io/auth/signOut
  /auth/users/current: https://monitoring-instana.instana.io/auth/users/current

websocketProxy:
  /api/data: https://monitoring-instana.instana.io/api/data
