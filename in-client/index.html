<!doctype html>
<html>
<head profile="http://www.w3.org/2005/10/profile">
  <meta charset="UTF-8"
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <link rel="icon"
        type="image/png"
        href="favicon.png">

  <title>Instana</title>

  <script>
    window.instana = {};
  </script>
  <script>
    window.instana.user = <!--#include virtual="/auth/users/current" -->;
  </script>
  <script>
    window.instana.build = <!--#include virtual="build.json" -->;
    window.instana.config = <!--#include virtual="config.json" -->;
  </script>

  <script>
    if (window.instana.config.environment !== 'demo' &&
        (!window.instana.user || window.instana.user.error)) {
      window.location.href = '/auth/signIn?returnUrl=' +
        encodeURIComponent(window.location.href);
    }
  </script>
</head>
<body>

  <script src="bundle/index.js"></script>
</body>
</html>
