<!doctype html>
<html>
<head profile="http://www.w3.org/2005/10/profile">
  <meta charset="UTF-8"
        name="viewport"
        content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="google" content="notranslate">

  <link rel="icon"
        type="image/png"
        href="favicon.png">

  <title>Instana</title>

  <script>
window.instana = {};
</script>
  <script>
    window.instana.user = <!--#include virtual="/api/checkUserAccessPermitted" -->;
  </script>
  <script>
    window.instana.build = <!--#include virtual="build.json" -->;
    window.instana.config = <!--#include virtual="config.json" -->;
    window.instana.activeTheme = '<!--#include virtual="activeTheme.name" -->';
    window.instana.activeThemeConfig = <!--#include virtual="activeTheme.json" -->;
    window.instana.searchFields = <!--#include virtual="/api/search/fields" -->;
    window.instana.settings = <!--#include virtual="/api/ui/settings" -->;
  </script>

  <script>
  if (!window.instana.user || window.instana.user.error) {
  window.instana.user = null;
}
if (!window.instana.user) {
  window.location.href = '/auth/signIn?returnUrl=' + encodeURIComponent(window.location.href);
}
</script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:700,400,300&subset=latin,greek,vietnamese,latin-ext,cyrillic,cyrillic-ext">
  <link rel="stylesheet" href="bundle/index.css">
</head>
<body>
  <div id="main">
  </div>

  <noscript>
    <div class="no_js_content">
      <div class="left-side">
        <h1 class="title">
          JavaScript disabled
        </h1>
        <p class="message">
          The Instana interface requires JavaScript. Please enable JavaScript in your browser to continue.
        </p>
      </div>
    </div>
  </noscript>
  <script src="bundle/index.js"></script>
</body>
</html>
