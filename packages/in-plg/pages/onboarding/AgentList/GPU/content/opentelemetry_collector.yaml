
kubectl apply -f - <<EOF
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: opentelemetry-operator-system
spec:
  image: otel/opentelemetry-collector-contrib:latest
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
      prometheus/nvidia-dcgm:
        config:
          scrape_configs:
            - job_name: 'nvidia-dcgm'
              scrape_interval: 5s
              static_configs:
                - targets: ['${dcgmExporterEndpoint}']
    processors:
      batch:
      resource:
        attributes:
          - key: server.address
            from_attribute: net.host.name
            action: insert
          - key: server.port
            from_attribute: net.host.port
            action: insert
          - key: db.instance.name
            from_attribute: service.instance.id
            action: insert
          - key: service.name
            value: nvidia-dcgm
            action: update
          - key: INSTANA_PLUGIN
            value: dcgm
            action: insert
    exporters:
      otlp:
        endpoint: ${agentServiceEndpoint}
        tls:
          insecure: true
    service:
      pipelines:
        metrics/nvidia-dcgm:
          receivers: [prometheus/nvidia-dcgm]
          processors: [batch, resource]
          exporters: [otlp]
EOF
