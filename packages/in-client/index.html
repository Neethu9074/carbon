  <script>
  if (!window.instana.user || window.instana.user.errors) {
  window.instana.user = null;
}
if (!window.instana.user) {
  setTimeout(() => {
    document.querySelector('.in-index-centered-content').innerHTML = `
Not signed in / backend unavailable. Will retry in 3s.
<br /><br />
Are you using the right URL for local development, e.g. local-instana.pink.instana.rocks vs local-instana.instana.io?
`;
    document.querySelector('.in-index-centered-content').style = 'color: #fff; font-size: 2rem; text-align: center';
  }, 500);
  setTimeout(() => {
	if (window.instana.config.featureFlags?.playwithEnabled)
  {
		window.location.href = '/auth/demo/autoSignIn?returnUrl=' + encodeURIComponent(window.location.href);
	} else {
		window.location.href = '/auth/signIn?returnUrl=' + encodeURIComponent(window.location.href);
	}
}, 3000);
}
</script>
