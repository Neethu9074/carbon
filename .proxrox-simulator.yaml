serverName: local-instana.instana.io
port: 4000
root: false
ssi: true
tls: true
proxy:
  /: http://127.0.0.1:3000

  /auth/signIn: http://127.0.0.1:5000/auth/signIn
  /auth/signOut: http://127.0.0.1:5000/auth/signOut
  /auth/users/current: http://127.0.0.1:5000/auth/users/current

websocketProxy:
  /api/data: http://127.0.0.1:5000/data
