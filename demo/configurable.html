<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Instana</title>
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>
  <div id="WebGL"></div>

  <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
	<script>
    var toggle = false;
    $( "#controlsPanel" ).click(function() {
      toggle = !toggle;
      if(toggle){
        var w = 400;
      }
      else{
        var w = 10;
      }
      $( this ).animate( {width:w+'px'}, 200 );
    });
  </script>

  <div id="controlsPanel">
    <div><input id="newHostButton" type="button" value="new host"></div>
    <div><input id="newContainerButton" type="button" value="new container"></div>
    <div><input id="OffOnlineButton" type="button" value="toggle Off/Online"></div>
    <div><input id="destroyCubeButton" type="button" value="destroy cube"></div>
    <div><input id="showInGrafanaButton" type="button" value="show dashboard"></div>
    <div><input id="switchStateButton" type="button" value="switch state"></div>
    <div><input id="showWalkingGridButton" type="button" value="show walking grid"></div>
  </div>

  <script src="../target/bundle/index.js "></script>
  <script>
    window.initConfigurable();
  </script>

  <img src="../src/images/instanaLogo.png" class="logo">
</body>
</html>
