<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Instana</title>
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>
  <div id="WebGL"></div>

  <img src="../src/images/instanaLogo.png" class="logo">

  <div id="controlsPanel">
    <div id="cp_left"></div>
    <div id="cp_right">
      <div><input id="newHostButton" type="button" value="new host">
      <input id="newContainerButton" type="button" value="new container"></div>
      <div><input id="OffOnlineButton" type="button" value="toggle Off/Online">
      <input id="destroyCubeButton" type="button" value="destroy cube"></div>
      <div><input id="showInGrafanaButton" type="button" value="show dashboard">
      <input id="switchStateButton" type="button" value="switch state"></div>
      <div><input id="showWalkingGridButton" type="button" value="show walking grid"></div>
      <div id="stats"></div>
    </div>
  </div>

  <script src="../target/bundle/index.js "></script>
  <script>
    window.initConfigurable();
  </script>


  <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>

  <script>
    var toggle = true;
    $( "#controlsPanel" ).click(function() {
      toggle = !toggle;
      var w = 20;
      if(toggle){
        var w = 400;
      }
      $( this ).animate( {width:w+'px'}, 200 );
    });
    $( "#controlsPanel" ).click();
  </script>
</body>
</html>
