---
apiVersion: v1
kind: ConfigMap
metadata:
  name: updatebrowserlist-template-config
  namespace: tekton-frontendenablement
data:
  output-pvc.yaml: |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: output
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
